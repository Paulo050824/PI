{% extends "base.html" %}

{% block title %}
    Cadastro - Silverio Tattoo.ink
{% endblock %}

{% block content %}

<div class="cadastro-container">

    <div class="cadastro-box">

        <h1>Criar conta</h1>

        <p>Cadastre-se para acessar o Silverio Tattoo.ink</p>

        <form method="POST" action="{{ url_for('cadastrohtml') }}">

            <div class="campo">
                <label for="nome">Nome</label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome"
                    required
                >
            </div>

            <div class="campo">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >
            </div>

            <div class="campo">
                <label for="confirmar_senha">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmar_senha"
                    name="confirmar_senha"
                    placeholder="Digite a senha novamente"
                    required
                >
            </div>

            <button type="submit">
                Criar conta
            </button>

        </form>

        <div class="login-link">

            <p>
                Já possui uma conta?
                <a href="{{ url_for('login') }}">
                    Entrar
                </a>
            </p>

        </div>

    </div>

</div>

{% endblock %}
